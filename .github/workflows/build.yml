name: Build Multi Platform

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  # LINUX (AppImage + ZIP)
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y maven wget zip

      - name: Build
        run: mvn clean package

      - name: Build AppImage + ZIP
        run: bash scripts/build-linux.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: target/dist/*


  # WINDOWS (EXE)
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: mvn clean package

      - name: Build EXE
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: target/dist/*


  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: |
            **/*.zip
            **/*.AppImage
            **/*.exe
